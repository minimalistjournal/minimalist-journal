<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Minimalist Journal — Curated Archive</title>
    <link rel="stylesheet" href="style.css">

    <!-- Open Graph / Social Media Meta Tags (SEO) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://minimalistjournal.github.io/minimalist-journal/">
    <meta property="og:title" content="The Minimalist Journal — A Curated Digital Archive">
    <meta property="og:description" content="A noise-free digital museum of curated everyday carry, desk setup, and aesthetic essentials from IDR 50k to 1M.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1523381210434-271e8be1f25b?auto=format&fit=crop&w=800&q=80">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Minimalist Journal — A Curated Digital Archive">
    <meta name="twitter:description" content="A noise-free digital museum of curated everyday carry, desk setup, and aesthetic essentials from IDR 50k to 1M.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1523381210434-271e8be1f25b?auto=format&fit=crop&w=800&q=80">

    <style>
        .catalog-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .sub-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .sub-btn {
            background: none;
            border: none;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.2s ease, font-weight 0.2s ease;
        }

        .sub-btn:hover, .sub-btn.active {
            color: #1a1a1a;
            font-weight: 700;
            border-bottom: 1px solid #1a1a1a;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .product-card:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .product-image-wrap {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #f2f2f2;
            overflow: hidden;
            margin-bottom: 12px;
            border-radius: 2px;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.03);
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1a1a1a;
        }

        .product-desc {
            font-size: 0.75rem;
            color: #777;
            margin: 0 0 8px 0;
            line-height: 1.4;
        }

        .product-price {
            font-size: 0.8rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .buy-btn {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #1a1a1a;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR ALA SSENSE -->
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">THE MINIMALIST JOURNAL</a></div>

        <!-- GENDER SELECTOR -->
        <div class="gender-nav">
            <button class="gender-btn active" onclick="setGender('all', this)">ALL</button>
            <button class="gender-btn" onclick="setGender('men', this)">MEN</button>
            <button class="gender-btn" onclick="setGender('women', this)">WOMEN</button>
        </div>
    </nav>

    <!-- KATALOG CONTAINER -->
    <main class="catalog-container">

        <!-- SUB-CATEGORY FILTER -->
        <div class="sub-nav">
            <button class="sub-btn active" onclick="setType('all', this)">ALL ITEMS</button>
            <button class="sub-btn" onclick="setType('tops', this)">TOPS</button>
            <button class="sub-btn" onclick="setType('bottoms', this)">BOTTOMS</button>
            <button class="sub-btn" onclick="setType('footwear', this)">FOOTWEAR</button>
            <button class="sub-btn" onclick="setType('accessories', this)">ACCESSORIES</button>
        </div>

        <!-- GRID PRODUK (DIISI OTOMATIS OLEH SCRIPT.JS) -->
        <div class="product-grid" id="productGrid"></div>
    </main>

    <!-- FOOTER -->
    <footer style="border-top: 1px solid #e5e5e5; padding: 25px 40px; font-size: 0.8rem; color: #666; display: flex; justify-content: space-between; align-items: center;">
        <div>&copy; 2026 The Minimalist Journal. All rights reserved.</div>
        <div>
            <a href="about.html" style="color: #666; text-decoration: none; margin-left: 15px;">About</a>
            <a href="privacy.html" style="color: #666; text-decoration: none; margin-left: 15px;">Privacy & Disclosure</a>
        </div>
    </footer>

    <!-- SCRIPT JS TERPISAH -->
    <script src="script.js"></script>

</body>
</html>
