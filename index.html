<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Minimalist Journal</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://minimalistjournal.github.io/minimalist-journal/">
    <meta property="og:title" content="The Minimalist Journal — A Curated Digital Archive">
    <meta property="og:description" content="A noise-free digital museum of curated everyday carry, desk setup, and aesthetic essentials.">
    <meta property="og:image" content="https://minimalistjournal.github.io/minimalist-journal/preview-image.jpg">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Minimalist Journal — A Curated Digital Archive">
    <meta name="twitter:description" content="A noise-free digital museum of curated everyday carry, desk setup, and aesthetic essentials.">
    <meta name="twitter:image" content="https://minimalistjournal.github.io/minimalist-journal/preview-image.jpg">
</head>
<body>

    <!-- NAVBAR ALA SSENSE WITH GENDER TOGGLE -->
    <nav class="navbar">
        <div class="logo">THE MINIMALIST JOURNAL</div>
        
        <!-- GENDER SELECTOR -->
        <div class="gender-nav">
            <button class="gender-btn active" onclick="setGender('all', this)">ALL</button>
            <button class="gender-btn" onclick="setGender('men', this)">MEN</button>
            <button class="gender-btn" onclick="setGender('women', this)">WOMEN</button>
        </div>
    </nav>

    <!-- SUB-FILTER ITEM TYPE -->
    <div class="sub-nav">
        <button class="item-btn active" onclick="setItemType('all', this)">ALL EDITS</button>
        <button class="item-btn" onclick="setItemType('tops', this)">TOPS</button>
        <button class="item-btn" onclick="setItemType('pants', this)">PANTS</button>
        <button class="item-btn" onclick="setItemType('footwear', this)">FOOTWEAR</button>
        <button class="item-btn" onclick="setItemType('accessories', this)">ACCESSORIES</button>
    </div>

    <!-- PRODUCT GRID -->
    <div class="container">
        <div class="product-grid" id="productContainer">
            <!-- Dimuat via script.js -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
